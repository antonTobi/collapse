<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-version" content="1.2.2">

  <title>Collapse</title>

  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Collapse" />
  <link rel="manifest" href="/favicon/site.webmanifest" />

  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">

  <style>
    /* The p5 canvas is 400x480; shrink it (preserving aspect ratio) only when
       the viewport is too narrow to fit it — never enlarge it. */
    #game {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #board canvas {
      display: block;
      max-width: 100vw;
      height: auto !important;
    }

    /* Always reserve space for the review button so the board never moves. */
    #reviewSlot {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
    }

    #reviewButton {
      -webkit-appearance: none;
      appearance: none;
      visibility: hidden;
      font-family: inherit;
      font-size: 15px;
      background: #fff;
      color: #111;
      border: 1px solid #111;
      border-radius: 3px;
      padding: 7px 18px;
      cursor: pointer;
    }

    #reviewButton.on {
      visibility: visible;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js" defer></script>
  <script src="config.js" defer></script>
  <script src="firebase-service.js" defer></script>
  <script src="achievements.js" defer></script>
  <script src="game.js" defer></script>
  <script src="sketch.js" defer></script>
</head>

<body>
  <div id="game">
    <div id="board"></div>
    <div id="reviewSlot">
      <button id="reviewButton" type="button">Review game</button>
    </div>
  </div>
</body>

</html>
