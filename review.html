<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collapse — Game Review</title>
    <link rel="icon" href="favicon/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e4e4e4;
            --ink: #111;
            --muted: #666;
            --accent: #22baac;
            --board-bg: #d7d7d7;
        }

        * {
            box-sizing: border-box;
        }

        /* Mobile-first: a single centred column that grows to the viewport width
           and never past the board's natural 400px. style.css centres the body. */
        body {
            min-height: 100%;
            padding: 16px;
            background: var(--bg);
            color: var(--ink);
            align-items: flex-start;
        }

        #app {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Back (left) and share (right) flank the centred score/username. */
        #topbar {
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        /* Centred over the first / last board columns (each column is 1/5 of the
           board, so the column centres sit at 10% and 90%). */
        #back, #share {
            position: absolute;
            top: 50%;
            border: none;
            background: transparent;
            color: var(--ink);
            padding: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #back { left: 10%; transform: translate(-50%, -50%); }
        #share { right: 10%; transform: translate(50%, -50%); }

        #back .icon, #share .icon {
            width: 24px;
            height: 24px;
        }

        #score {
            font-size: 36px;
            line-height: 43px;
            font-variant-numeric: tabular-nums;
        }

        #reviewer {
            font-size: 15px;
            color: var(--muted);
        }

        /* Sits just below the share icon (top-right, over the last column). */
        #toast {
            position: absolute;
            top: calc(50% + 20px);
            right: 10%;
            transform: translateX(50%);
            background: #111;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
            z-index: 10;
            transition: opacity .3s;
        }

        #toast[hidden] {
            display: none;
        }

        /* Fixed square that scales with the column. The canvas backing store is
           sized for the device pixel ratio in review.js. */
        #board {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            display: block;
            margin: 0 auto;
            background: var(--board-bg);
            touch-action: none;
            transition: box-shadow .15s;
        }

        /* Off the recorded line the board gets an accent frame so it is always
           obvious the game on screen is a branching variation. */
        #app.variation #board {
            box-shadow: 0 0 0 3px #111;
        }

        button {
            font: inherit;
            background: transparent;
            border: 1px solid #111;
            border-radius: 3px;
            padding: 7px 11px;
            cursor: pointer;
            color: inherit;
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        button.primary {
            background: #111;
            color: #fff;
        }

        /* Toggled-on state (playing / fast-forwarding / afterstate shown). */
        button.active {
            background: #111;
            color: #fff;
        }

        /* Hover only where a real pointer can hover, so a tap on a touch screen
           does not leave the button stuck looking hovered after release. */
        @media (hover: hover) and (pointer: fine) {
            button:hover {
                background: #111;
                color: #fff;
            }

            button:disabled:hover {
                background: transparent;
                color: inherit;
            }

            button.primary:hover {
                background: #333;
            }

            /* Icon-only topbar buttons stay flat; just dim on hover. */
            #back:hover, #share:hover {
                background: transparent;
                color: var(--muted);
            }
        }

        /* Lucide icons ride on currentColor; buttons flip colour on active/hover. */
        svg.icon {
            width: 20px;
            height: 20px;
            display: block;
        }

        #controls {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
        }

        #controls button {
            min-width: 46px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
        }

        #timeline {
            margin: 4px 5px 0;
        }

        #scrub {
            width: 100%;
            margin: 0;
            accent-color: var(--ink);
            display: block;
        }

        #move {
            color: var(--muted);
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* Evaluation graph: the bot's depth-2 estimate of the final score at
           every position across the game, with key-moment dots. */
        #graphWrap {
            display: none;
            flex-direction: column;
            gap: 4px;
        }

        #graphWrap.on {
            display: flex;
        }

        #graph {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 400 / 150;
            display: block;
            background: #efefef;
            touch-action: none;
        }

        #graphControls {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            font-size: 12px;
            color: var(--muted);
        }

        #zoom {
            flex: 1;
            max-width: 240px;
            accent-color: var(--ink);
        }

        #loading {
            min-height: 18px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        #loading[hidden] {
            display: none;
        }

        /* Board/graph toggles: "Move suggestions" and "Eval graph". */
        #suggestion {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            font-size: 14px;
            color: var(--muted);
            user-select: none;
            visibility: hidden;
        }

        #suggestion.on {
            visibility: visible;
        }

        #suggestion label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        #suggestion input {
            margin: 0;
            accent-color: var(--ink);
        }

        #empty {
            max-width: 400px;
            text-align: center;
            line-height: 1.5;
            margin: 0 auto;
        }
    </style>
    <script src="config.js" defer></script>
    <script src="bot/engine.js" defer></script>
    <script src="bot/eval.js" defer></script>
    <script src="bot/ntuple.js" defer></script>
    <script src="bot/search.js" defer></script>
    <script src="bot/mcts.js" defer></script>
    <script src="bot/freeze.js" defer></script>
    <script src="bot/agents.js" defer></script>
    <script src="review.js" defer></script>
</head>

<body>
    <main id="app" hidden>
        <header id="topbar">
            <button id="back" title="Exit review" aria-label="Exit review"></button>
            <div id="score">0</div>
            <div id="reviewer"></div>
            <button id="share" title="Copy link to this review" aria-label="Copy link to this review"></button>
            <div id="toast" hidden>Link copied!</div>
        </header>
        <canvas id="board" width="400" height="400" aria-label="Game board"></canvas>
        <div id="suggestion">
            <label><input type="checkbox" id="showSuggestion"> Move suggestions</label>
            <label><input type="checkbox" id="showGraph"> Eval graph</label>
        </div>
        <div id="controls">
            <button id="first" title="First (Home)"></button>
            <button id="backMove" title="Step back (←)"></button>
            <button id="step" title="Step forward (→)"></button>
            <button id="play" title="Play with animation (Space)"></button>
            <button id="ff" title="Fast-forward, no animation (F)"></button>
            <button id="last" title="Skip to end (End)"></button>
        </div>
        <div id="timeline"><input id="scrub" type="range" min="0" max="0" value="0" aria-label="Review move"></div>
        <div id="graphWrap">
            <canvas id="graph" width="400" height="150" aria-label="Evaluation graph"></canvas>
            <div id="graphControls">
                <span>Zoom</span>
                <input type="range" id="zoom" min="1" max="50" value="1" step="1" aria-label="Graph x zoom">
            </div>
        </div>
        <div id="move">Move 0</div>
        <div id="loading" hidden></div>
    </main>
    <section id="empty" hidden>
        <p>There is no finished game ready to review.</p>
        <button onclick="location.href='index.html'">← Back to game</button>
    </section>
</body>

</html>
